<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruna Bononi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo-link">
                <span class="logo-text">Bruna Bononi</span>
            </a>
            <nav>
                <a href="#sobre">Quem Somos</a>
                <a href="#areas">Áreas</a>
                <a href="#contato" class="btn-outline">Contato</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container hero-content">
            <h2 class="reveal"></h2>
            <p class="reveal"></p>
            <div class="reveal hero-buttons" style="margin-top: 30px;">
                <a class="btn" href="#">WhatsApp</a>
                <a class="btn-hero-outline" href="#contato">Agendar Consulta</a>
            </div>
        </div>
    </section>

    <section id="sobre" class="section reveal">
        <div class="container">
            <div style="max-width: 800px; margin: auto; text-align: center;">
                <h2>Bruna Bononi</h2>
                <p></p>
                <p class="quote"
                    style="border-left: 4px solid var(--accent); padding-left: 20px; margin-top: 30px; font-style: italic; text-align: left; color: #555;">
                </p>
            </div>
        </div>
    </section>

    <section id="areas" class="section dark">
        <div class="container">
            <h2 class="reveal text-center">Especialidades</h2>
            <div class="grid">
                <div class="card reveal">
                    <h3></h3>
                    <p></p>
                </div>
                <div class="card reveal">
                    <h3></h3>
                    <p></p>
                </div>
                <div class="card reveal">
                    <h3></h3>
                    <p></p>
                </div>
                <div class="card reveal">
                    <h3></h3>
                    <p></p>
                </div>
                <div class="card reveal">
                    <h3></h3>
                    <p></p>
                </div>
                <div class="card reveal">
                    <h3></h3>
                    <p></p>
                </div>
            </div>
        </div>
    </section>

    <section id="contato" class="section">
        <div class="container contato-grid">
            <div class="reveal contato-info">
                <h2>Fale Conosco</h2>
                <p></p>
                <a class="btn" href="#" style="margin-top:20px">Chamar no WhatsApp</a>
            </div>

            <form class="reveal form-contato" action="#" method="POST">
                <input type="text" name="name" placeholder="Seu Nome" required>
                <input type="email" name="email" placeholder="Seu E-mail" required>
                <textarea name="message" rows="4" placeholder="Como podemos ajudar?" required></textarea>
                <button type="submit" class="btn w-full">Enviar Mensagem</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <p><strong>Bruna Bononi</strong></p>
        <p>© 2026</p>
    </footer>

    <a href="#" class="whatsapp-float" aria-label="WhatsApp">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" width="30">
    </a>
    <script src="js/script.js"></script>
</body>
</html>
